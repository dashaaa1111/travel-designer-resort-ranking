# Шаг 6: проверка устойчивости рейтинга. Меняйте параметры только здесь, не в коде.
scenario: null                 # null -> основной сценарий (primary) из config/scenarios.yaml

monte_carlo:
  n_simulations: 5000
  seed: 42                     # фиксированный seed: повторный запуск даёт тот же результат
  concentration: 200           # Dirichlet: чем больше, тем ближе веса к базовым.
                               # 200 -> в 90% симуляций вес 25 лежит в 20-30 (±20%), вес 5 в 2.8-7.8
  missing_price_score: [0, 100]  # у курортов без цены ценовой балл равномерно от 0 до 100 вместо 50

interval:                      # границы интервала места, процентили по симуляциям
  low: 5
  high: 95

component_factor: 1.2          # «+20% к весу компонента» из раздела 11 ТЗ

# Группы приоритета для каталога. Правило проверяется сверху вниз,
# курорт попадает в первую группу, условие которой выполнено:
# P(место <= top_k) >= min_probability.
groups:
  - {group: A, label: "Волна 1: устойчивый топ", top_k: 5, min_probability: 0.8}
  - {group: B, label: "Волна 2: сильные", top_k: 10, min_probability: 0.8}
  - {group: C, label: "Кандидаты: граница топ-10", top_k: 15, min_probability: 0.5}
default_group: {group: D, label: "Остальные"}
not_operating_group: {group: X, label: "Не работает: не добавлять сейчас"}
