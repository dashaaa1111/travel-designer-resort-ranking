# Веса показателей рейтинга популярности (сумма = 100).
# Меняйте веса только здесь, не в коде. Любое изменение описывайте в README.
weights:
  region_trips: 25    # поездки в регион за 2025 год
  region_growth: 10   # рост поездок 2025 к 2024
  avg_stay: 5         # ночей на одну поездку
  pistes: 10          # сегменты трасс в радиусе 6 км (OSM)
  lifts: 7            # линии подъёмников в радиусе 6 км (OSM)
  lodging: 5          # объекты размещения в радиусе 6 км (OSM)
  amenities: 3        # питание и достопримечательности в радиусе 6 км (OSM)
  snow_days: 8        # дни со снегом за сезон
  freezing_days: 6    # дни с морозом за сезон
  snowfall: 6         # сумма снегопада за сезон
  airport: 8          # близость аэропорта (чем ближе, тем выше балл)
  transport: 2        # объекты транспорта в радиусе 6 км (OSM)
  price: 5            # цена ски-пасса (чем дешевле, тем выше балл)
